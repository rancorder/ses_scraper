# ============================================================
# 参鋼株式会社 営業スクリーニングプロファイル
# 目的: コイル材・鋼板・切板の営業先を分類する
#       A：量産プレス型 / B：小ロット試作型 / C：材料調達リスク型
# ============================================================

name: 参鋼_鋼板材営業先スクリーニング
slug: sanko_steel
description: |
  コイル材・SPCC/SPHC・メッキ鋼板・切板の販売先候補を発掘する。
  「金属加工っぽい会社」ではなく「どの材料相談なら聞く理由があるか」を分類する。
  A（量産プレス）/ B（小ロット試作）/ C（材料調達リスク）/ D（対象外）の4分類で優先度を判定。

# IPROSの検索キーワード
keywords_search:
  - プレス加工
  - 板金加工
  - 精密板金
  - 順送プレス
  - 試作板金
  - 小ロット板金
  - 製缶板金
  - レーザー加工
  - 金属プレス
  - 鋼板加工
  - 溶接加工
  - 切板加工

