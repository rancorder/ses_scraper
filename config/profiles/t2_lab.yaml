# ============================================================
# T2 Laboratory 向けスクリーニングプロファイル 改訂版
# 元資料: 「判定ルールの可視化.pdf」
# 方針:
#   1) 原資料の3軸を独立判定する
#   2) 営業優先度の補助点は3軸判定と混同しない
#   3) 現行 ProfileScorer と互換性のある detection のみ使用する
# ============================================================

name: T2 Laboratory 協力企業候補（原資料準拠版）
description: >
  T2の原資料に定義された「メーカー」「ハードウェアの自社製品」
  「電子回路設計」の3軸を独立評価し、エッジAI・IoT・OEM等は
  営業優先度を補助する別軸として加点する。

keywords_search:
  - エッジAI
  - 組み込み開発
  - 画像処理
  - IoT
  - FPGA
  - 電子回路設計
  - 制御基板
  - 受託製造
  - EMS

primary_axis_ids:
  - manufacturer_detection
  - own_hw_product
  - circuit_design

scoring_axes:
  - id: manufacturer_detection
    name: メーカー判定（物理的なモノの製造・加工）
    points: 30
    description: >
      自社工場・提携工場、EMS、受託製造・加工など、企業自身が
      物理的なモノを製造・加工している根拠を検出する。
      「製造業向けサービス」等の支援事業だけでは成立させない。
    detection: regex
    pattern: '(?=[\s\S]*(自社工場|自社の工場|提携工場|製造拠点|生産拠点|製造設備|生産設備|EMS|受託製造|受託加工|金属加工|樹脂加工|板金加工|部品製造|装置製造|自社製造|自社生産))(?=[\s\S]*(製造|加工|生産|量産|製作|組立|実装))'

  - id: own_hw_product
    name: ハードウェアの自社製品
    points: 30
    description: >
      自社企画・自社ブランド・独自仕様の物理製品を市場提供している
      根拠を検出する。受託加工品、他社商品の販売、ソフトウェアのみは含めない。
    detection: regex
    pattern: '^(?![\s\S]*(自社製品は持たず|自社製品を持たない|自社製品は保有しない|自社ブランド製品は保有しない|ハードウェアは扱わない|ソフトウェアのみ|クラウドサービスのみ))(?=[\s\S]*(自社製品|自社開発製品|自社ブランド|オリジナル製品|独自製品|自社企画|自社設計製品))(?=[\s\S]*(ロボット|ディスプレイ|家電|計測器|検査装置|制御装置|電源装置|表示装置|通信モジュール|カメラモジュール|IC|センサー|機器|装置|デバイス|ハードウェア|基板|製品型番|製品カタログ))'

  - id: circuit_design
    name: 電子回路設計
    points: 25
    description: >
      電子回路・基板・制御基板・組み込みHW・IC等について、
      設計・開発を自社製品または受託事業として行う根拠を検出する。
      販売・取扱い・実装のみでは成立させない。
    detection: regex
    pattern: '^(?![\s\S]*(回路設計は行わない|電子回路の設計は行わない|設計業務は行わない|自社設計や製造は行わない|設計は顧客支給|設計は行っていない|販売のみ|取扱いのみ))(?=[\s\S]*(電子回路|回路|基板|PCB|制御基板|組み込みハードウェア|ハードウェア|IC|LSI|FPGA|アナログ回路|デジタル回路|電源回路))(?=[\s\S]*(設計|設計開発|開発設計|回路開発|基板開発|受託設計|設計受託|ハードウェア開発))'

  - id: edge_ai_domain
    name: 補助評価：エッジAI・画像処理
    points: 10
    detection: keyword_any
    keywords:
      - エッジAI
      - 画像処理
      - 画像認識
      - 物体検出
      - 外観検査
      - マシンビジョン
      - コンピュータビジョン
      - OpenCV
      - エッジコンピューティング
      - 推論エンジン

  - id: iot_domain
    name: 補助評価：IoT・通信
    points: 5
    detection: keyword_any
    keywords:
      - IoT
      - M2M
      - 無線通信
      - センサーネットワーク
      - コネクテッドデバイス

  - id: oem_presence
    name: 補助評価：OEM・協業対応
    points: 5
    detection: keyword_any
    keywords:
      - OEM
      - ODM
      - 共同開発
      - 技術提携
      - カスタム開発
      - 受託開発

  - id: penalty_software_only
    name: ソフトウェア・SaaS専業ペナルティ
    points: -30
    detection: keyword_any
    keywords:
      - ソフトウェア開発専業
      - SaaS専業
      - ソフトウェアのみ
      - クラウドサービスのみ
      - アプリケーション開発のみ
      - ネットワーク構築のみ

  - id: penalty_trading_only
    name: 商社・代理店専業ペナルティ
    points: -25
    detection: keyword_any
    keywords:
      - 販売のみ
      - 他社製品の販売のみ
      - 仕入れて販売するだけ
      - 製造を行わない専門商社
      - 正規代理店として販売
      - 輸入販売のみ

  - id: penalty_service_industry
    name: サービス業専業ペナルティ
    points: -20
    detection: keyword_any
    keywords:
      - コンサルティング専業
      - 物流専業
      - 出版事業のみ
      - メディア事業のみ
      - 人材派遣専業

score_cap: 100
score_floor: -30

thresholds:
  excellent: 70
  good: 45

score_labels:
  - range: [70, 100]
    label: "営業最優先候補（3軸結果を個別確認）"
  - range: [45, 69]
    label: "営業優先候補（3軸結果を個別確認）"
  - range: [15, 44]
    label: "要確認"
  - range: [-30, 14]
    label: "低優先・対象外候補"

ai_instruction: |
  T2 Laboratoryの原資料に基づき、次の3軸を互いに独立して
  ○・×・不明で判定してください。

  1. メーカー：企業自身が物理的なモノを製造・加工しているか。
     EMS・受託製造・受託加工も○。製造業向けサービスだけなら×。
  2. ハードウェアの自社製品：自社企画・自社ブランド・独自仕様の
     物理製品を市場提供しているか。受託加工品、他社商品の販売、
     ソフトウェア・クラウドのみは×。
  3. 電子回路設計：電子回路・基板・制御基板・組み込みHW・IC等を、
     自社製品または受託事業として設計・開発しているか。
     販売、取扱い、実装のみは×。

  合計スコアから3軸の○×を推測せず、各軸の根拠を個別に示してください。

crawl_paths:
  - /
  - /product
  - /products
  - /lineup
  - /catalog
  - /technology
  - /tech
  - /about
  - /company
  - /business
  - /service
  - /factory
  - /facilities
  - /equipment
  - /oem
  - /odm
  - /contract
  - /development
  - /design
  - /recruit
  - /news
