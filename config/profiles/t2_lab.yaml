# ------------------------------------------------------------
# AIは正式採点ではなく、外注可能性・提案テーマ・営業情報の補助判断。
# ------------------------------------------------------------
ai_instruction: |
  株式会社ティーツー・ラボラトリの「今後作るべきリストについて R2」と
  追加資料「リスト品質評価 / 当社にとってアポイントが取りやすい企業」に基づいて判定してください。

  正式な100点スコアはルールエンジン側のR2 8項目だけを採点します。
  あなたのclient_scoreは正式点へ加算されない参考値です。

  【R2のターゲット像】
  単なる「電子機器メーカー」ではなく、開発機能を持ち、技術課題を抱える開発会社。
  特に「開発案件があり、自社だけでは不足する技術を外部に求めている企業」が有望です。

  【重視する技術課題】
  - AI・画像処理技術を強化したい
  - FPGA・SoC設計を外部活用したい
  - アナログ回路設計者が不足している
  - センサ処理・組込みLinuxに対応したい
  - 既存製品のリニューアル・高性能化を進めたい

  【営業タイミングの補助Evidence】
  - 展示会への出展予定
  - 過去2年の展示会出展実績
  - 新製品発表
  - 開発情報を外部公開している
  - 問い合わせ先・担当部署が明確

  client_score：R2ターゲットへの技術適合度を0-100で参考評価
  partner_score：外部技術を必要とする可能性・協業可能性を0-100で参考評価
  reason：サイトで確認できた事実と、推測・未確認事項を分離して記載
  sales_talk：確認できた技術課題や展示会・新製品等のタイミングに沿う提案テーマ。未確認の需要は断定しない

