# ============================================================
# T2 Laboratory 向けスクリーニングプロファイル R2準拠版
# Source: 「今後作るべきリストについて R2」2026-07-23
# 目的: 「技術課題を持つ開発会社」を100点満点で評価し、
#       S/A/B/Cランクで優先順位を付ける。
# ============================================================

name: T2 Laboratory R2 開発会社スクリーニング
description: >
  T2資料「今後作るべきリストについて R2」に準拠。
  単なる電子機器メーカーではなく、自社製品・電子回路・FPGA/SoC・
  組込みLinux・AI/画像処理等の開発機能を持ち、開発活動や技術者採用が
  確認できる企業を優先する。採点はR2記載の8項目・合計100点のみで行う。

keywords_search:
  - 電子回路設計
  - FPGA
  - SoC
  - 組込みLinux
  - 組み込みLinux
  - 画像処理
  - AI
  - 自社製品
  - 研究開発
  - 開発部門
  - 技術者採用
  - 新製品

# ------------------------------------------------------------
# R2 2章「新しいリスト作成条件」そのままの100点配点
# ------------------------------------------------------------
scoring_axes:

  - id: own_product_manufacturer
    name: 自社製品メーカー
    points: 20
    description: >
      自社製品を開発し、物理製品・装置・基板・電子機器等を市場提供する企業。
      単なる販売代理・他社製品販売だけでは加点しない。
    detection: keyword_groups_all
    keyword_groups:
      -
        - 自社製品
        - 自社開発製品
        - 自社ブランド
        - オリジナル製品
        - 独自製品
        - 製品開発
        - 製品情報
        - 製品一覧
        - 製品ラインアップ
      -
        - 電子機器
        - 電子デバイス
        - ハードウェア
        - 装置
        - 制御装置
        - 検査装置
        - 計測器
        - センサー
        - 基板
        - モジュール
        - ロボット
        - 製造
        - 開発・製造
        - 開発製造

  - id: circuit_design
    name: 電子回路設計あり
    points: 20
    description: 電子回路・基板・電気回路の設計開発を事業として行っている。
    detection: keyword_any
    keywords:
      - 電子回路設計
      - 回路設計
      - 基板設計
      - PCB設計
      - プリント基板設計
      - 制御回路設計
      - アナログ回路設計
      - デジタル回路設計
      - 電源回路設計
      - ハードウェア設計
      - 電気回路設計

  - id: fpga_soc_development
    name: FPGA・SoC開発あり
    points: 15
    description: FPGAまたはSoCを用いた設計・開発を行っている。
    detection: keyword_any
    keywords:
      - FPGA開発
      - FPGA設計
      - FPGA回路
      - FPGA
      - SoC開発
      - SoC設計
      - SoC
      - System on Chip
      - Zynq
      - Cyclone
      - Arria
      - Artix
      - Kintex
      - Versal

  - id: embedded_linux_development
    name: 組込みLinux開発あり
    points: 10
    description: 組込みLinux環境・BSP・Linuxベース組込み開発を行っている。
    detection: keyword_any
    keywords:
      - 組込みLinux
      - 組み込みLinux
      - Embedded Linux
      - Yocto
      - Buildroot
      - Linux BSP
      - BSP開発
      - Linuxドライバ
      - デバイスドライバ開発
      - Linux組込み
      - Linux組み込み

  - id: ai_vision
    name: AI・画像処理あり
    points: 10
    description: AI・画像処理・画像認識等の技術を開発または製品へ利用している。
    detection: keyword_any
    keywords:
      - AI
      - 人工知能
      - エッジAI
      - 機械学習
      - 深層学習
      - ディープラーニング
      - 画像処理
      - 画像認識
      - 物体検出
      - 外観検査
      - マシンビジョン
      - コンピュータビジョン
      - OpenCV

  - id: development_department
    name: 開発部門がある
    points: 10
    description: 研究開発・製品開発・技術開発を担う組織または拠点が確認できる。
    detection: keyword_any
    keywords:
      - 開発部
      - 開発本部
      - 技術開発部
      - 研究開発部
      - 研究開発本部
      - R&D部門
      - R&Dセンター
      - 開発センター
      - 技術センター
      - 研究所
      - 開発拠点
      - 製品開発部

  - id: engineer_recruiting
    name: 技術者採用中
    points: 5
    description: 技術・開発系人材を現在募集しているEvidenceがある。
    detection: keyword_any_on_page
    target_pages:
      - /recruit
      - /career
      - /careers
      - /jobs
      - /job
      - /saiyo
      - /採用
    keywords:
      - 回路設計
      - 電子回路
      - FPGA
      - SoC
      - 組込み
      - 組み込み
      - Linux
      - ハードウェアエンジニア
      - 開発エンジニア
      - 技術者募集
      - エンジニア募集
      - 技術職
      - 開発職

  - id: active_new_product
    name: 新製品開発が活発
    points: 10
    description: >
      R2必須項目「新製品発売（2年以内）」をEvidenceとして、
      直近2年の新製品・新機種・製品リリースを確認する。
    detection: recent_keyword_any_on_page
    recent_years: 2
    target_pages:
      - /news
      - /topics
      - /press
      - /release
      - /product
      - /products
      - /new
    keywords:
      - 新製品
      - 新商品
      - 新機種
      - 新モデル
      - 発売
      - 販売開始
      - リリース
      - 製品化
      - 新たに開発
      - 開発しました

score_cap: 100
score_floor: 0
score_sum_max: 100
bonus_rules: []

# R2判定基準
thresholds:
  excellent: 90
  good: 80

rank_thresholds:
  S: 90
  A: 80
  B: 70
  C: 0

# 営業リソース集中対象（R2記載どおりS/A）
candidate_ranks:
  - S
  - A

# R2は8項目合計100点を正式点とするため、AI点は総合点へ加算しない。
# AIは理由・営業トーク・外注可能性の参考判定にのみ使用する。
ai_score_bonus_weight: 0.0

