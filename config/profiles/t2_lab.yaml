# ============================================================
# T2 Laboratory 向けスクリーニングプロファイル
# 目的: T2の3軸判定基準（メーカー・自社製品・電子回路設計）に
#       基づき、エッジAI・組み込み協力企業候補を識別する
# ベース: 判定ルールの可視化.pdf（T2 Laboratory Confidential）
# ============================================================

name: T2 Laboratory 協力企業候補
description: >
  T2の3軸判定基準（メーカー・自社HW製品・電子回路設計）に準拠したスクリーニング。
  SaaS・商社・コンサル等の非製造業を除外し、エッジAI・組み込み開発の
  協力企業候補を高精度で抽出する。

keywords_search:
  - エッジAI
  - 組み込み開発
  - 画像処理
  - IoT
  - 組み込みシステム
  - FPGA
  - 画像検査
  - エッジコンピューティング
  - 電子回路設計
  - 制御基板

scoring_axes:

  # ════════════════════════════════════════════════════════
  # 軸①：メーカー判定（T2の第1条件）
  # 基準：自社工場・提携工場でモノを製造・加工しているか
  # ════════════════════════════════════════════════════════

  - id: manufacturer_detection
    name: メーカー判定（製造・加工業か）
    points: 30
    description: >
      自社工場・提携工場でハードウェア・装置・電子デバイス・素材を
      製造・加工している企業を検出。EMS・受託製造も含む。
    detection: keyword_count
    min_hits: 2
    keywords:
      - 製造
      - 加工
      - 工場
      - 生産
      - 製作
      - 量産
      - 製品製造
      - ものづくり
      - モノづくり
      - EMS
      - 受託製造
      - 受託加工
      - 金属加工
      - 部品製造
      - 装置製造
      - 設備製造
      - 電子デバイス
      - ハードウェア製造
      - 自社工場
      - 提携工場

  # ════════════════════════════════════════════════════════
  # 軸②：自社ハードウェア製品の有無（T2の第2条件）
  # 基準：自社ブランド・独自仕様の物理的な製品を保有しているか
  # ════════════════════════════════════════════════════════

  - id: own_hw_product
    name: 自社HW製品の有無
    points: 30
    description: >
      自社企画・ブランドの物理製品（ロボット・ディスプレイ・家電・IC・
      計測器等）を市場に提供している企業を検出。型番・製品ページの存在も加点。
    detection: keyword_and_pattern
    keywords:
      - 製品情報
      - 製品一覧
      - 型番
      - ラインアップ
      - 自社製品
      - 製品カタログ
      - 製品紹介
      - 自社開発製品
      - オリジナル製品
      - 自社ブランド
      - ロボット
      - センサー
      - 計測器
      - 検査装置
      - 制御装置
      - 電源装置
      - 表示装置
      - 通信モジュール
      - カメラモジュール
      - ICモジュール
    patterns:
      - "[A-Z]{1,5}[-_]?\\d{2,}[-_]?[A-Z0-9]*"
      - "\\d+\\.?\\d*\\s*(MHz|GHz|MB|GB|mA|mW|W|V|fps|Mbps|nm)"
    url_signals:
      - /product
      - /products
      - /lineup
      - /solution
      - /technology
      - /catalogue

  # ════════════════════════════════════════════════════════
  # 軸③：電子回路設計の有無（T2の第3条件）
  # 基準：電子回路・基板の設計技術を事業として有しているか
  # ════════════════════════════════════════════════════════

  - id: circuit_design
    name: 電子回路設計軸
    points: 25
    description: >
      制御基板・組み込みHW・ICの設計開発を行っている企業、または
      受託事業としてハードウェア・電子回路設計を請け負う企業を検出。
    detection: keyword_any
    keywords:
      - 電子回路設計
      - 回路設計
      - 基板設計
      - プリント基板
      - PCB設計
      - 制御基板
      - 組み込みハードウェア
      - ハードウェア設計
      - IC設計
      - LSI設計
      - FPGA
      - マイコン
      - マイクロコントローラ
      - ARM
      - ARM Cortex
      - RTOS
      - ファームウェア
      - 組み込み
      - Yocto
      - Buildroot
      - RISC-V
      - ベアメタル
      - 電気回路
      - アナログ回路
      - デジタル回路
      - 電源回路

  # ════════════════════════════════════════════════════════
  # 追加加点：エッジAI・IoT技術領域（T2の重点領域）
  # ════════════════════════════════════════════════════════

  - id: edge_ai_domain
    name: エッジAI・画像処理領域
    points: 10
    description: エッジAI・画像処理・コンピュータビジョン技術の保有
    detection: keyword_any
    keywords:
      - エッジAI
      - 画像処理
      - 画像認識
      - 物体検出
      - 外観検査
      - マシンビジョン
      - コンピュータビジョン
      - OpenCV
      - 深層学習
      - 機械学習
      - エッジコンピューティング
      - エッジデバイス
      - 推論エンジン

  - id: iot_domain
    name: IoT・通信技術領域
    points: 5
    description: IoT・M2M・無線通信技術の保有
    detection: keyword_any
    keywords:
      - IoT
      - M2M
      - Internet of Things
      - 無線通信
      - センサーネットワーク
      - リモートモニタリング
      - コネクテッドデバイス
      - スマートデバイス

  - id: oem_presence
    name: OEM／受託開発対応
    points: 5
    description: OEM・ODM・共同開発・技術提携の記載
    detection: keyword_count
    min_hits: 2
    keywords:
      - OEM
      - ODM
      - 受託開発
      - 共同開発
      - 技術提携
      - カスタム開発
      - 協力会社
      - パートナー企業

  # ════════════════════════════════════════════════════════
  # 除外ペナルティ（T2の×判定条件）
  # ════════════════════════════════════════════════════════

  - id: penalty_software_only
    name: ソフトウェア・SaaS専業ペナルティ
    points: -30
    description: >
      T2の×条件：物理的なモノを作っていない企業。
      ソフトウェア開発・SaaS・IT/DXソリューション専業。
    detection: keyword_any
    keywords:
      - SaaS
      - クラウドサービス
      - ソフトウェア開発専業
      - アプリ開発
      - Webシステム開発
      - DXソリューション
      - ITソリューション専業
      - システムインテグレーター専業
      - ネットワーク構築のみ
      - ソフトウェアのみ

  - id: penalty_trading_only
    name: 商社・代理店ペナルティ
    points: -25
    description: >
      T2の×条件：他社製品の販売のみを行う企業。
      製造・加工を伴わない専門商社・代理店・卸売。
    detection: keyword_any
    keywords:
      - 専門商社
      - 代理店
      - 正規代理店
      - 総代理店
      - 卸売
      - 販売代理
      - 輸入販売
      - 輸出販売
      - 商社

  - id: penalty_service_industry
    name: サービス業ペナルティ
    points: -20
    description: >
      T2の×条件：メディア・出版・物流・コンサルティング等のサービス業。
    detection: keyword_any
    keywords:
      - コンサルティング専業
      - 経営コンサル
      - 物流業
      - 配送業
      - 出版社
      - メディア企業
      - 人材派遣専業
      - 警備業

# スコア上限
score_cap: 100
score_floor: -30

# 判定閾値（T2の3軸○○○に対応）
thresholds:
  excellent: 60   # ◎ 3軸すべて該当する可能性が高い企業
  good: 35        # ○ 2軸以上該当する可能性がある企業

score_labels:
  - range: [60, 100]
    label: "最優先候補（メーカー×自社製品×回路設計 すべて該当見込み）"
  - range: [35, 59]
    label: "優先候補（2軸以上該当見込み）"
  - range: [10, 34]
    label: "要確認（1軸該当または判定不明）"
  - range: [-30, 9]
    label: "対象外（非製造業・商社・SW専業）"

# Ollama AI判定指示
ai_instruction: |
  T2 Laboratoryの3軸判定基準に基づいて評価してください。

  【判定の優先順位】
  1. メーカー判定：自社工場・提携工場で物理的なモノを製造・加工しているか
     ×の場合：SaaS・商社・物流・コンサルなど → 低スコア
  2. 自社HW製品：自社ブランドの物理製品（SW・クラウドのみはNG）を保有しているか
  3. 電子回路設計：制御基板・組み込みHW・ICの設計を事業として行っているか

  【T2が最も求める企業像】
  メーカー(○) + 自社製品(○) + 回路設計(○)
  = 電気制御を伴う機器・デバイス・ロボットを自社で開発・製造している企業

  client_score：エッジAI・組み込み技術の深さと製造業としての適格性（0-100）
  partner_score：T2との協力関係における外注需要の高さ（0-100）

# クロール対象パス
crawl_paths:
  - /
  - /product
  - /products
  - /lineup
  - /solution
  - /solutions
  - /technology
  - /tech
  - /about
  - /company
  - /business
  - /service
  - /oem
  - /odm
  - /partner
  - /recruit
  - /careers
  - /news
