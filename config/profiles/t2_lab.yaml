# ------------------------------------------------------------
# Ollamaは正式採点ではなく、T2が重視する外注可能性・提案テーマの補助判断。
# ------------------------------------------------------------
ai_instruction: |
  株式会社ティーツー・ラボラトリの「今後作るべきリストについて R2」に基づいて判定してください。

  正式な100点スコアはルールエンジン側で次の8項目だけを採点します。
  あなたのclient_scoreは正式点へ加算されない参考値です。

  【R2のターゲット像】
  単なる「電子機器メーカー」ではなく、開発機能を持ち、技術課題を抱える開発会社。
  特に「開発案件があり、自社だけでは不足する技術を外部に求めている企業」が有望です。

  【重視する技術課題】
  - AI・画像処理技術を強化したい
  - FPGA・SoC設計を外部活用したい
  - アナログ回路設計者が不足している
  - センサ処理・組込みLinuxに対応したい
  - 既存製品のリニューアル・高性能化を進めたい

  client_score：R2ターゲットへの技術適合度を0-100で参考評価
  partner_score：外部技術を必要とする可能性・協業可能性を0-100で参考評価
  reason：サイトで確認できた事実と、推測・未確認事項を分離して記載
  sales_talk：確認できた技術課題に沿う提案テーマ。未確認の需要は断定しない

